# netlify.toml — configuración de buscARTE
#
# Lo CRÍTICO de este archivo: declarar las funciones programadas (scheduled functions).
# Sin esto, los comentarios "Schedule: ..." dentro de los .js NO hacen nada y los emails
# automáticos (resumen mensual y recordatorio de perfil) nunca se ejecutan.
#
# Cron en UTC. Argentina (ART) = UTC-3, así que 13:00 UTC = 10:00 ART.
# El nombre entre comillas es el del archivo de la función sin .js.

[build]
  command = "node scripts/build-site.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  # Git CD toma también esta versión como runtime por defecto de Functions.
  # Node 24 LTS conserva el runtime de los deploys manuales anteriores y el
  # usado en las pruebas aisladas, sin volver a la configuración histórica 20.
  NODE_VERSION = "24"

[functions."resumen-mensual"]
  # Día 1 de cada mes, 10:00 ART
  schedule = "0 13 1 * *"

[functions."recordatorio-perfil"]
  # Cada día, 10:00 ART. Sólo genera eventos deduplicados; no envía el lote.
  schedule = "0 13 * * *"

[functions."email-worker"]
  # Despacha pendientes con prioridad transaccional y cuota atómica compartida.
  schedule = "*/5 * * * *"
